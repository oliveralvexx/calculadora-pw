<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Desenvolvido por Miguel Oliver</h1>
        <div class="calculadora">
            <div id="tela"></div>
            <button class="btnC" value="CE">CE</button>
            <button class="btn()" value="DEL">DEL</button>
            <button class="btn%" value="">()</button>
            <button class="btn/" value="/">÷</button>
            <button class="btn7" value="7">7</button>
            <button class="btn8" value="8">8</button>
            <button class="btn9" value="9">9</button>
            <button class="btn*" value="*">x</button>
            <button class="btn4" value="4">4</button>
            <button class="btn5" value="5">5</button>
            <button class="btn6" value="6">6</button>
            <button class="btn-" value="-">-</button>
            <button class="btn1" value="1">1</button>
            <button class="btn2" value="2">2</button>
            <button class="btn3" value="3">3</button>
            <button class="btn+" value="+">+</button>
            <button class="btn+/-" value="">+/-</button>
            <button class="btn0" value="0">0</button>
            <button class="btn," value=".">,</button>
            <button class="btn=" value="=">=</button>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
